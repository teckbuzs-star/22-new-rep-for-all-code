<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <pre><script>
        for (var row = 1; row <= 7; row++) {
            for (var column = 1; column <= row; column++) {
                document.write("#");
            }
            document.write("<br>");
        }
    </script></pre>
</body>
</html>
