<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table tag 2</title>
</head>
<body>
    <table border="1" width="50%" height="50%" cellpadding="10" cellspacing="10" align="center"> 
    <caption>this is a simple table</caption> 
        <tr bgcolor="red">
            <td>A</td>
            <td>B</td>
            <td height="40" rowspan="2">c</td>
            
        </tr>
        <tr bgcolor="yellow">
            
            <td>E</td height="10%">
            <td>F</td>
        </tr>
    </table>
    
</body>
</html>
